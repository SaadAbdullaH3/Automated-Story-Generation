name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for that branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux is what the container runs; Windows is what it is developed on.
        # The two disagree about fonts and path separators, which is exactly
        # the kind of thing that only shows up here.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install ffmpeg and fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ffmpeg does all the audio/video work. The Noto fonts are what stop
          # burned-in Urdu subtitles rendering as blank boxes (and what the
          # subtitle-font tests render with).
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-dejavu-core fonts-noto-core

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Check ffmpeg is on PATH
        run: ffmpeg -version

      - name: Install dependencies
        # The S3 client and moto (a local fake of S3) let the off-machine
        # backup tests run here too, offline.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-s3.txt "moto>=5"

      - name: Every module imports
        # A syntax error in a file no test touches should still fail the build.
        run: python -m compileall -q agents backend jobs mcp shared state_manager main.py

      - name: Tests
        # The suite runs fully offline: the mock LLM writes the script and
        # images are the local placeholder, so no key is needed and none of
        # this spends anyone's quota.
        run: python -m pytest -q --timeout=600
        env:
          PIPELINE_SKIP_DOTENV: "1"

  web:
    name: web · build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Build the static export
        # next build also type-checks; it runs first so next-env.d.ts exists
        # for the stand-alone check below.
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: The export is what FastAPI serves
        run: |
          test -f out/index.html
          test -f out/studio/index.html
          echo "export OK: $(find out -name '*.html' | wc -l) pages"

  image:
    # The image is what the server runs, and the one place its fonts, ffmpeg
    # build and Python wheels exist together — so it is built and checked on
    # every change rather than discovered on deploy day.
    name: image · build and run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: storygen:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What the server needs is in it
        run: >
          docker run --rm storygen:local python -c
          "import kokoro_onnx, soundfile, onnxruntime, psycopg, boto3, argon2;
          print('voices, Postgres and S3 drivers present')"

      - name: Subtitles render in every script, and first boot doesn't race
        # Run inside the image: these are about its fonts and its database
        # drivers, not the runner's.
        run: >
          docker run --rm -e PIPELINE_SKIP_DOTENV=1 storygen:local
          python -m pytest -q -p no:cacheprovider
          tests/unit/test_m9_subtitle_fonts.py tests/unit/test_m9_schema_race.py

      - name: The whole stack starts on a fresh database and answers
        env:
          DATA_PATH: ${{ runner.temp }}/storygen-data
          HOST_PORT: "8000"
        run: |
          mkdir -p "$DATA_PATH" && chmod 777 "$DATA_PATH"
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/auth/status | grep -q '"needs_setup":true'
          docker compose ps
          # A crash on first boot shows up as a restart, even if it recovered.
          test "$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q api)")" = 0
          test "$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q worker)")" = 0

      - name: Logs, if anything above failed
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

