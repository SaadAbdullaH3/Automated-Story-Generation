# Production shape: the API, a pool of workers, and Postgres.
#
#   docker compose up --build            api + one worker + db
#   docker compose up --scale worker=3   three renders at once
#
# API keys come from .env (same file the CLI uses). Without it everything still
# runs on the offline providers — template script, placeholder images.
#
# The services share ./data so the worker's output is what the API serves.
# That works on one host; across hosts the assets need object storage.
# DATA_PATH and HOST_PORT move them — e.g. a throwaway stack beside a running
# app: DATA_PATH=/tmp/x HOST_PORT=8040 docker compose -p storygen-test up

x-app: &app
  build: .
  image: storygen:local
  env_file:
    - path: .env
      required: false
  # Set here, not only in the image: these beat .env, which on a laptop holds
  # host paths (C:\...) that mean nothing inside the container.
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://storygen:storygen@db:5432/storygen
    DATA_DIR: /app/data
    KOKORO_MODEL: /app/data/models/kokoro/kokoro-v1.0.onnx
    KOKORO_VOICES: /app/data/models/kokoro/voices-v1.0.bin
  volumes:
    - ${DATA_PATH:-./data}:/app/data
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    models:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storygen
      POSTGRES_PASSWORD: storygen
      POSTGRES_DB: storygen
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # The API and worker wait for this, otherwise their first query races
      # Postgres' own start-up and the container exits.
      test: ["CMD-SHELL", "pg_isready -U storygen"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once per `up`: fetches and checksums the Kokoro voice model into the
  # data volume (a no-op once it is there). If it can't, the app still starts
  # and the voice picker says why Kokoro is unavailable; voices fall back to
  # edge-tts.
  models:
    image: storygen:local
    build: .
    command: ["sh", "-c", "python scripts/get_kokoro.py --quiet || echo 'Kokoro not available — voices will fall back to edge-tts'"]
    environment:
      DATA_DIR: /app/data
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app-env
      WORKER_INLINE: "0"        # the worker service does the work
    ports:
      - "${HOST_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "main.py", "worker"]
    # The image's check asks the web server, which a worker doesn't run. This
    # one asks whether the worker has reached the queue in the last 2 minutes
    # (the loop touches the file each poll, the job heartbeat every 15 s).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /tmp/storygen-worker-alive -mmin -2 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
